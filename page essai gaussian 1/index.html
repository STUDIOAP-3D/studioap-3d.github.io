<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualiseur Gaussian Splat</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e8e6e1;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; text-align: center;
            padding: 24px; transition: opacity .4s; }
  #status.hidden { opacity: 0; pointer-events: none; }
  #msg { font-size: 1.05rem; max-width: 34rem; line-height: 1.5; }
  #pick { display: none; padding: 10px 18px; border: 1px solid #5b6270; border-radius: 6px;
          background: transparent; color: inherit; font: inherit; cursor: pointer; }
  #pick:hover, #pick:focus-visible { border-color: #e8e6e1; outline: none; }
  #file { display: none; }
  #hint { position: fixed; left: 12px; bottom: 10px; font-size: .8rem; opacity: .5; }
  body.drag #status { background: rgba(255,255,255,.06); }
</style>
<!-- Optionnel : fichier généré par embed_spz.py pour que le double-clic fonctionne sans serveur -->
<script src="modele_spz.js" onerror="void 0"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="status">
  <div id="msg">Chargement du modèle…</div>
  <button id="pick" type="button">Choisir un fichier .spz</button>
  <input id="file" type="file" accept=".spz,.ply,.splat,.ksplat,.sog">
</div>
<div id="hint">Clic gauche : tourner · clic droit : déplacer · molette : zoom</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

// Nom du fichier à charger (placé dans le même dossier que cette page)
const SPZ_FILE = "modele.spz";

const statusEl = document.getElementById("status");
const msgEl = document.getElementById("msg");
const pickBtn = document.getElementById("pick");
const fileInput = document.getElementById("file");

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 0, 3);

const spark = new SparkRenderer({ renderer });
scene.add(spark);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let current = null;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function frame(mesh) {
  try {
    mesh.updateMatrixWorld(true);
    const box = mesh.getBoundingBox().clone().applyMatrix4(mesh.matrixWorld);
    const center = box.getCenter(new THREE.Vector3());
    const radius = box.getSize(new THREE.Vector3()).length() / 2 || 1;
    const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));
    controls.target.copy(center);
    camera.position.copy(center).add(new THREE.Vector3(0, 0, dist * 0.8));
    camera.near = radius / 100;
    camera.far = radius * 100;
    camera.updateProjectionMatrix();
    controls.update();
  } catch (e) {
    console.warn("Cadrage automatique impossible :", e);
  }
}

async function show(options) {
  if (current) { scene.remove(current); current.dispose?.(); current = null; }
  const mesh = new SplatMesh(options);
  mesh.quaternion.set(1, 0, 0, 0); // les splats sortent souvent à l'envers
  await mesh.initialized;
  scene.add(mesh);
  current = mesh;
  frame(mesh);
  statusEl.classList.add("hidden");
}

function askForFile(text) {
  statusEl.classList.remove("hidden");
  msgEl.textContent = text;
  pickBtn.style.display = "inline-block";
}

async function loadFromFile(file) {
  msgEl.textContent = "Chargement de " + file.name + "…";
  pickBtn.style.display = "none";
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    await show({ fileBytes: bytes, fileName: file.name });
  } catch (e) {
    console.error(e);
    askForFile("Ce fichier n'a pas pu être lu. Essaie un autre fichier .spz.");
  }
}

pickBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => fileInput.files[0] && loadFromFile(fileInput.files[0]));
window.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drag"); });
window.addEventListener("dragleave", () => document.body.classList.remove("drag"));
window.addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("drag");
  if (e.dataTransfer.files[0]) loadFromFile(e.dataTransfer.files[0]);
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

// Chargement automatique au démarrage
(async () => {
  try {
    if (window.SPZ_B64) {
      // Mode double-clic : le .spz est embarqué dans modele_spz.js
      const bytes = b64ToBytes(window.SPZ_B64);
      window.SPZ_B64 = null;
      await show({ fileBytes: bytes, fileName: SPZ_FILE });
    } else {
      // Mode serveur web : le .spz est chargé depuis le dossier de la page
      await show({ url: SPZ_FILE });
    }
  } catch (e) {
    console.error(e);
    askForFile("Le fichier " + SPZ_FILE + " n'a pas pu être chargé automatiquement. Glisse-le ici ou choisis-le.");
  }
})();
</script>
</body>
</html>
