<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page protégée</title>

    <link rel="stylesheet" href="style.css">

    <!-- API Sketchfab -->
    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.9.0.js"></script>

    <style>
        #page-protegee {
            display: none;
        }

        #acces-refuse {
            display: none;
            background-color: #272425;
            color: white;
            text-align: center;
            min-height: 100vh;
            padding-top: 100px;
        }
    </style>
</head>

<body>

    <!-- Message si mauvais mot de passe -->
    <div id="acces-refuse">
        <h1>⛔ Accès refusé</h1>
        <p>Mot de passe incorrect. Rafraichir la page pour réessayer</p>
    </div>

    <!-- PAGE PROTÉGÉE -->
    <div id="page-protegee">

        <div class="py-5 min-height-90vh"
             style="min-height:90vh; background-color:#272425!important;">

            <div class="container">

                <div class="row">

                    <div class="d-flex flex-column col-md-8 mb-3">

                        <iframe
                            id="api-frame"
                            width="100%"
                            height="auto"
                            allowfullscreen
                            mozallowfullscreen="true"
                            webkitallowfullscreen="true"
                            class="mb-3 rounded shadow-lg embed-responsive embed-responsive-4by3 border border-info"
                            loading="lazy">
                        </iframe>

                    </div>

                    <div class="d-flex flex-column col-md-4 mx-auto">

                        <div class="navTree" id="navTree">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>
        const motDePasse = prompt("Mot de passe :");

        if (motDePasse === "Transversal+") {

            // Afficher la page
            document.getElementById("page-protegee").style.display = "block";

            // Charger sf_showhide.js APRÈS le mot de passe
            const script = document.createElement("script");
            script.src = "sf_showhide.js";

            document.body.appendChild(script);

        } else {

            // Afficher le message d'erreur
            document.getElementById("acces-refuse").style.display = "block";

        }
    </script>

</body>
</html>
