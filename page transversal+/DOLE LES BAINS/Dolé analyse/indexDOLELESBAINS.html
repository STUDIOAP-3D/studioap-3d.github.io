<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page protégée</title>

    <link rel="stylesheet" href="style.css">

    <!-- API Sketchfab -->
    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.9.0.js"></script>

    <style>
        #page-protegee {
            display: none;
        }

        #acces-refuse {
            display: none;
            background-color: #272425;
            color: white;
            text-align: center;
            min-height: 100vh;
            padding-top: 100px;
        }

        /* Case à cocher pour la visibilité des calques */
        .layer-checkbox {
            float: right;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #0d6efd;
            margin-top: 6px;
            margin-right: 6px;
        }

        /* Icône info pour les calques (Arbres remarquables, etc.) */
        .layer-info-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            color: #0d6efd;
            text-decoration: none;
            cursor: pointer;
            vertical-align: middle;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .layer-info-link:hover {
            color: #0a58ca;
            transform: scale(1.25);
        }

        .layer-info-link svg {
            display: block;
        }

        span.caret,
        span.caret_child {
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>

<body>

    <!-- Message si mauvais mot de passe -->
    <div id="acces-refuse">
        <h1>⛔ Accès refusé</h1>
        <p>Mot de passe incorrect.</p>
    </div>

    <!-- PAGE PROTÉGÉE -->
    <div id="page-protegee">

        <div class="py-5 min-height-90vh"
             style="min-height:90vh; background-color:#272425!important;">

            <div class="container">

                <div class="row">

                    <div class="d-flex flex-column col-md-8 mb-3">

                        <iframe
                            id="api-frame"
                            width="100%"
                            height="auto"
                            allowfullscreen
                            mozallowfullscreen="true"
                            webkitallowfullscreen="true"
                            class="mb-3 rounded shadow-lg embed-responsive embed-responsive-4by3 border border-info"
                            loading="lazy">
                        </iframe>

                    </div>

                    <div class="d-flex flex-column col-md-4 mx-auto">

                        <div class="navTree" id="navTree">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>
        // Afficher directement la page, sans demander de mot de passe.
        document.getElementById("page-protegee").style.display = "block";

        // Lien vers la page HTML de votre choix pour l'icône "info" des arbres remarquables :
        window.LIEN_ARBRES_REMARQUABLES = "page_arbres_remarquables.pdf";

        // Charger sf_showhide.js au chargement de la page.
        const script = document.createElement("script");
        script.src = "sf_showhide.js";
        document.body.appendChild(script);
    </script>

</body>
</html>
