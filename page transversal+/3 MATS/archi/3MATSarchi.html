<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Trois Mâts – Visualisation 3D</title>

    <!-- Nouvelle feuille de style (autonome, remplace style.css pour cette page) -->
    <link rel="stylesheet" href="style_dole.css">

    <!-- API Sketchfab -->
    <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.9.0.js"></script>

    <style>
        #page-protegee { display: none; }

        /* Respect des majuscules / minuscules saisies (le thème met sinon les onglets principaux en MAJUSCULES) */
        #myUL > li > span.caret,
        #myUL > li > span.caret_child { text-transform: none; }
    </style>
</head>

<body>

    <!-- PAGE -->
    <div id="page-protegee">

        <header class="topbar">
            <div class="brand">
                <div class="logo">3D</div>
                <div>
                    <h1>Les Trois Mâts</h1>
                    <div class="sub">Visualisation 3D interactive · TRANSVERSAL-Plus</div>
                </div>
            </div>
            <div class="pill" id="compteur">Chargement…</div>
        </header>

        <div class="layout">

            <div class="viewer">
                <iframe
                    id="api-frame"
                    allowfullscreen
                    mozallowfullscreen="true"
                    webkitallowfullscreen="true"
                    loading="lazy">
                </iframe>

                <!-- Barre de navigation des vues panoramiques (remplace "Select an annotation") -->
                <div class="vues-bar" id="vues-bar" style="display:none">
                    <button type="button" id="vues-prev" aria-label="Vue précédente">&#8249;</button>
                    <span id="vues-label">Sélectionner une vue panoramique</span>
                    <button type="button" id="vues-next" aria-label="Vue suivante">&#8250;</button>
                </div>
            </div>

            <aside class="panel">
                <h2>Calques de la scène</h2>
                <div class="hint">Afficher / masquer les objets</div>

                <!-- L'arborescence des calques est générée ici par sf_showhide.js -->
                <div class="navTree" id="navTree"></div>

                <div class="panel-foot">
                    <button type="button" class="btn" id="btn-tout-afficher">Tout afficher</button>
                    <button type="button" class="btn" id="btn-tout-masquer">Tout masquer</button>
                </div>
            </aside>

        </div>
    </div>


    <script>
        // =====================================================================
        //  RÉGLAGES DE LA PAGE (à modifier ici, sans toucher à sf_showhide.js)
        // =====================================================================

        // =====================================================================
        //  0) NUMÉRO DU MODÈLE SKETCHFAB (l'identifiant de l'embed)
        //     Changez uniquement cette ligne : les noms des calques sont lus
        //     automatiquement dans le nouveau modèle.
        //     Astuce : ajoutez  ?noms  à l'adresse de la page pour voir la liste
        //     exacte des calques du modèle et la copier dans les réglages ci-dessous.
        // =====================================================================
        window.SKETCHFAB_UID = "c8b2a520a88d448bae7d9ff443da0272";

        // Lien de l'icône "info" des arbres remarquables
        window.LIEN_ARBRES_REMARQUABLES = "page_arbres_remarquables.pdf";

        // ---------------------------------------------------------------------
        // 1) ORDRE DES ONGLETS
        //    Les calques apparaissent dans l'ordre de cette liste.
        //    Ceux qui ne sont pas listés viennent après, dans l'ordre du modèle 3D.
        //    Le nom peut être écrit avec ou sans accents / majuscules / "_".
        //    Cet ordre s'applique aussi aux sous-calques et aux dossiers (voir 2).
        // ---------------------------------------------------------------------
        window.ORDRE_CALQUES = [
            "Niveaux",
            "Environnement existant",
            "Mesures",
        ];

        // ---------------------------------------------------------------------
        // 1b) ORDRE DES SOUS-CALQUES, parent par parent (optionnel)
        //     Clé = nom du parent (onglet ou dossier), valeur = ordre de ses enfants.
        // ---------------------------------------------------------------------
        window.ORDRE_SOUS_CALQUES = {
            "Niveaux": ["Niveau 0", "Niveau 1", "Niveau 2"]
        };

        // ---------------------------------------------------------------------
        // 1c) RENOMMER UN CALQUE (optionnel)
        //     "nom dans le modèle Sketchfab" : "nom affiché dans la page"
        // ---------------------------------------------------------------------
        window.RENOMMER_CALQUES = {
            "Existant": "Environnement existant"
        };

        // ---------------------------------------------------------------------
        // 2) DOSSIERS (SOUS-DOSSIERS) DE CALQUES
        //    Regroupe des calques existants sous un onglet "dossier".
        // ---------------------------------------------------------------------
        window.GROUPES_CALQUES = [
            {
                nom: "Niveaux",
                calques: ["Niveau 0", "Niveau 1", "Niveau 2"]
            }
        ];

        // ---------------------------------------------------------------------
        // 3) COULEURS (optionnel)
        //    Par défaut, chaque onglet principal prend une couleur de la palette.
        //    Pour imposer une couleur à un onglet, ajoutez une ligne ci-dessous.
        // ---------------------------------------------------------------------
        window.COULEURS_CALQUES = {
            // "CHEMINS ANCIENS": "#f59e0b",
            // "PROJET": "#38bdf8"
        };

        // Ouvrir tous les dossiers au chargement ? (true / false)
        window.DOSSIERS_OUVERTS_PAR_DEFAUT = false;

        // =====================================================================

        // Afficher la page
        document.getElementById("page-protegee").style.display = "block";

        // Charger sf_showhide.js
        const script = document.createElement("script");
        script.src = "sf_showhide.js";
        document.body.appendChild(script);
    </script>

</body>
</html>
