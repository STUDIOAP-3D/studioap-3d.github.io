<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Les Trois Mâts</title><!-- le titre de l'onglet se change dans CONFIG.pageTitle -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper:      #0e1318;
            --surface:    #161c23;
            --ink:        #edf1f4;
            --ink-soft:   #93a1ac;
            --line:       #262f38;
            --navy:       #3d82f5;
            --navy-hover: #5b95fa;

            --header-h:  68px;
            --sidebar-w: 272px;
            --radius:    12px;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            height: 100dvh;
            display: grid;
            grid-template-rows: var(--header-h) minmax(0, 1fr);
            background: var(--paper);
            color: var(--ink);
            font-family: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .icon { display: inline-flex; }
        .icon svg { width: 18px; height: 18px; display: block; }

        /* ───────────── Bandeau du haut ───────────── */
        .header {
            display: flex;
            align-items: center;
            padding: 0 20px 0 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 24px;
        }

        .brand-mark { width: 30px; height: 30px; color: var(--navy); flex: none; }

        .brand-title {
            margin: 0;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -.01em;
            line-height: 1.1;
            white-space: nowrap;
        }

        .brand-sub {
            margin: 3px 0 0;
            font-size: 12.5px;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .divider {
            flex: none;
            width: 1px;
            align-self: stretch;
            margin: 16px 0;
            background: var(--line);
        }

        .headline { flex: 1 1 auto; min-width: 0; padding: 0 24px; }

        .headline-title,
        .headline-sub {
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .headline-title { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
        .headline-sub   { margin-top: 2px; font-size: 13px; color: var(--ink-soft); }

        .actions {
            flex: none;
            display: flex;
            align-items: center;
            gap: 2px;
            margin-right: 12px;
        }

        .action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 9px;
            color: var(--ink);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: background .15s;
        }
        .action .icon { color: var(--navy); }
        a.action:hover { background: rgba(255, 255, 255, .07); }

        /* Logo partenaire */
        .partner {
            flex: none;
            display: flex;
            align-items: center;
            padding: 7px 16px;
            margin-right: 16px;
            background: #ffffff;
            border-radius: 9px;
            text-decoration: none;
            line-height: 0;
        }
        .partner img {
            display: block;
            height: 24px;
            width: auto;
        }

        #navSlot { flex: none; margin-left: auto; }

        .nav-btn {
            flex: none;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 12px;
            background: var(--navy);
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            transition: background .15s;
        }
        .nav-btn:hover { background: var(--navy-hover); }

        /* ───────────── Corps ───────────── */
        .layout {
            display: grid;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            min-height: 0;
        }

        /* Menu des thématiques */
        .sidebar {
            min-height: 0;
            overflow-y: auto;
            padding: 22px 14px 20px 20px;
            border-right: 1px solid var(--line);
        }

        .sidebar-title {
            margin: 0 0 10px 10px;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: .01em;
            color: var(--ink-soft);
        }

        .theme-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }

        .theme {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 10px 9px 12px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }
        .theme:hover { background: rgba(255, 255, 255, .05); }

        .theme[aria-current="true"] {
            background: var(--surface);
            border-color: var(--line);
        }
        .theme[aria-current="true"]::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--c);
        }
        .theme[aria-current="true"] .chip { box-shadow: inset 0 0 0 1.5px var(--c); }

        /* Pastille numérotée : la couleur de la thématique sert de repère, comme un calque */
        .chip {
            flex: none;
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: color-mix(in srgb, var(--c) 26%, var(--surface));
            color: color-mix(in srgb, var(--c) 65%, #fff);
            font-size: 14px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .theme-text { display: flex; flex-direction: column; min-width: 0; }
        .theme-title { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
        .theme-sub   { font-size: 12px; line-height: 1.3; color: var(--ink-soft); }

        /* Planche : viewer + cartouche */
        .stage {
            min-width: 0;
            min-height: 0;
            display: flex;
            gap: 16px;
            padding: 20px 24px 24px;
        }

        .sheet {
            --c: var(--navy);
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(15, 27, 38, .04);
        }

        .viewer {
            position: relative;
            min-height: 0;
            background-color: #10151b;
            background-image:
                linear-gradient(to right,  rgba(255, 255, 255, .045) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, .045) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .viewer iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            opacity: 0;
            transition: opacity .35s ease;
        }
        .viewer iframe.is-ready { opacity: 1; }

        .viewer-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .empty-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 340px;
            padding: 24px 28px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            text-align: center;
        }
        .empty-card .icon { color: var(--c); }
        .empty-card .icon svg { width: 40px; height: 40px; }
        .empty-msg { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-soft); }

        /* Cartouche */
        .sheet-bar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px 12px 16px;
            border-top: 1px solid var(--line);
            background: var(--surface);
        }
        .sheet-bar::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -1px;
            height: 2px;
            background: var(--c);
            transition: background .25s;
        }
        .sheet-bar .chip { width: 40px; height: 40px; font-size: 18px; border-radius: 10px; }

        .sheet-text { flex: 0 1 auto; max-width: 42%; min-width: 0; }
        .sheet-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; }
        .sheet-sub   { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
        .sheet-title, .sheet-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sheet-note {
            flex: 1 1 auto;
            min-width: 0;
            padding: 0 16px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--ink);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sheet-nav { flex: none; display: flex; align-items: center; gap: 6px; }

        .sheet-count {
            margin-right: 6px;
            font-size: 13px;
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }

        .step-btn {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }
        .step-btn:hover { background: var(--paper); border-color: #3a444e; }

        /* Panneau latéral : commentaires + photo */
        .side-panel {
            flex: 0 0 clamp(260px, 22vw, 360px);
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .comments-card {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 14px 14px 8px;
            background: #ffffff;
            border: 1px solid #d9dee4;
            border-radius: var(--radius);
            box-shadow: 0 1px 3px rgba(15, 27, 38, .10);
            color: #111820;
            scrollbar-color: #b8c0c8 #ffffff;
        }
        .comments-title {
            margin: 0 0 10px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .01em;
            color: #014796;
        }
        .comments-body p,
        .comments-body > div.comment-section {
            margin: 0 0 8px;
            padding: 0 0 8px 11px;
            border-bottom: 1px solid #dfe3e7;
            font-size: 12px;
            line-height: 1.34;
            color: #202830;
        }
        .comments-body p:last-child,
        .comments-body > div.comment-section:last-child { margin-bottom: 0; }
        .comments-body p.is-placeholder { font-style: italic; }
        .comments-body .comment-section {
            position: relative;
        }
        .comments-body .comment-section p {
            margin: 0 0 8px;
            padding: 0;
            border: 0;
        }
        .comments-body .comment-section p:last-child { margin-bottom: 0; }
        .comments-body .comment-section ul {
            margin: 6px 0 0;
            padding-left: 14px;
        }
        .comments-body .comment-section li {
            margin-bottom: 4px;
            padding: 0;
            border: 0;
        }
        .comments-body .comment-section li:last-child { margin-bottom: 0; }
        .comments-body .comment-section::before {
            content: "";
            position: absolute;
            left: 0;
            top: 1px;
            bottom: 8px;
            width: 3px;
            border-radius: 0 2px 2px 0;
            background: var(--navy);
        }
        .comments-body .comment-kicker {
            display: block;
            margin-bottom: 3px;
            color: #0155b4;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .02em;
        }
        .comments-body .force-title {
            display: block;
            margin: 9px 0 6px;
            padding-left: 0;
            border: 0;
            color: #00428d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .02em;
        }
        .comments-body .line-force {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid #d9dee4;
            border-bottom: 1px solid #d9dee4;
        }
        .comments-body .line-force span {
            min-width: 0;
            padding: 6px 4px;
            text-align: center;
            font-size: 8.5px;
            line-height: 1.18;
            font-weight: 700;
            color: #034fa5;
            border-right: 1px solid #d9dee4;
        }
        .comments-body .line-force span:last-child { border-right: 0; }

        .photo-card {
            flex: 0 0 auto;
            position: relative;
            height: clamp(140px, 18vh, 210px);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .photo-card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--ink-soft);
            text-align: center;
            padding: 12px;
        }
        .photo-empty .icon svg { width: 26px; height: 26px; }
        .photo-empty span { font-size: 12px; line-height: 1.4; }

        /* Accessibilité */
        .theme:focus-visible,
        .nav-btn:focus-visible,
        .step-btn:focus-visible,
        .action:focus-visible {
            outline: 2px solid var(--navy);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        /* ───────────── Écrans étroits ───────────── */
        @media (max-width: 1300px) {
            .stage { flex-direction: column; overflow-y: auto; }
            .side-panel { flex: none; flex-direction: row; }
            .comments-card { flex: 1 1 auto; max-height: 260px; }
            .photo-card { flex: 0 0 220px; height: auto; }
        }

        @media (max-width: 1100px) {
            .actions { display: none; }
        }

        @media (max-width: 860px) {
            :root { --header-h: 60px; }

            .header { padding: 0 14px; }
            .brand { padding-right: 0; }
            .brand-title { font-size: 17px; }
            .brand-sub { font-size: 11.5px; }
            .divider, .headline, .partner { display: none; }
            .nav-btn { width: 36px; height: 36px; }

            .layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }

            .sidebar {
                padding: 10px 12px;
                overflow: hidden;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }
            .sidebar-title { display: none; }

            .theme-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
            .theme { flex: none; width: auto; min-width: 190px; background: var(--surface); border-color: var(--line); }

            .stage { padding: 12px; gap: 12px; }
            .sheet-count { display: none; }
            .sheet-note { display: none; }
            .side-panel { flex-direction: column; }
            .photo-card { flex: 0 0 160px; }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
            <path d="M6 23V9M14 23V3.5M22 23V12" stroke-width="2.4"/>
            <path d="M3 23.5h22" stroke-width="1.6"/>
        </svg>
        <div>
            <h1 class="brand-title" id="brandTitle"></h1>
            <p class="brand-sub" id="brandSub"></p>
        </div>
    </div>

    <div class="divider"></div>

    <div class="headline">
        <h2 class="headline-title" id="headlineTitle"></h2>
        <p class="headline-sub" id="headlineSub"></p>
    </div>

    <div id="partnerSlot"></div>

    <nav class="actions" id="actions"></nav>

    <div id="navSlot"></div>
</header>

<div class="layout">

    <aside class="sidebar">
        <h3 class="sidebar-title" id="sidebarTitle"></h3>
        <ul class="theme-list" id="themeList" aria-labelledby="sidebarTitle"></ul>
    </aside>

    <main class="stage">
        <div class="sheet" id="sheet">

            <div class="viewer">
                <iframe
                    id="viewerFrame"
                    allow="autoplay; fullscreen; xr-spatial-tracking"
                    allowfullscreen>
                </iframe>
                <div class="viewer-empty" id="viewerEmpty" hidden>
                    <div class="empty-card">
                        <span class="icon" id="emptyIcon" aria-hidden="true"></span>
                        <p class="empty-msg" id="viewerEmptyMsg"></p>
                    </div>
                </div>
            </div>

            <div class="sheet-bar">
                <span class="chip" id="sheetChip" aria-hidden="true"></span>
                <div class="sheet-text">
                    <p class="sheet-title" id="sheetTitle"></p>
                    <p class="sheet-sub" id="sheetSub"></p>
                </div>
                <p class="sheet-note" id="sheetNote"></p>
                <div class="sheet-nav">
                    <span class="sheet-count" id="sheetCount"></span>
                    <button type="button" class="step-btn" id="prevBtn"></button>
                    <button type="button" class="step-btn" id="nextBtn"></button>
                </div>
            </div>

        </div>

        <aside class="side-panel">
            <div class="comments-card">
                <h3 class="comments-title" id="commentsTitle"></h3>
                <div class="comments-body" id="commentsBody"></div>
            </div>
            <div class="photo-card" id="photoCard">
                <img id="photoImg" alt="" hidden>
                <div class="photo-empty" id="photoEmpty" hidden>
                    <span class="icon" id="photoEmptyIcon" aria-hidden="true"></span>
                    <span id="photoEmptyMsg"></span>
                </div>
            </div>
        </aside>

    </main>

</div>


<script>

    /* ══════════════════════════════════════════════════════════════
     *  CONFIGURATION — TOUS LES TEXTES DE LA PAGE SE MODIFIENT ICI
     * ══════════════════════════════════════════════════════════════
     *
     *  - icon (actions) : "eye", "puzzle" ou "target"
     *  - link : adresse ouverte au clic (laisser "" si aucun lien)
     *  - color : couleur de la pastille numérotée, du repère actif
     *            dans le menu et du liseré du cartouche
     *  - model : ID du modèle Sketchfab (ou URL complète d'embed).
     *            Laisser "" ou "ID_MODELE_x" affiche le message
     *            emptyMessage à la place du viewer.
     *  - note : courte légende affichée au centre du bandeau du bas
     *           (laisser "" pour ne rien afficher)
     *  - comments : liste de paragraphes affichés dans le panneau
     *               « Commentaires » à droite (laisser [] pour le
     *               message par défaut)
     *  - photo : URL ou data-URI d'une image affichée sous les
     *            commentaires (laisser "" pour un espace réservé)
     */

    const CONFIG = {

        pageTitle: "Les Trois Mâts – Parking Horizon – Basse-Terre",

        /* Bloc en haut à gauche */
        brand: {
            title:    "Les Trois Mâts",
            subtitle: "Parking Horizon – Basse-Terre"
        },

        /* Bloc central du bandeau */
        headline: {
            title:    "Explorer les périmètres d’intervention",
            subtitle: "Une maquette interactive pour comprendre, analyser et dialoguer"
        },

        themes: [
            {
                title:    "Périmètre attribué au projet",
                subtitle: "Niveaux 1 + toiture - terrasse",
                color:    "#3cb21f",
                model:    "58b04cbcd9da44af8d1fb39555d8033b",
                note:     "Ce qui est aujourd’hui clairement identifié dans l’AOT",
                comments: [
                    { tag: "div", html: '<span class="comment-kicker">MORPHOLOGIE ACTUELLE</span><p>L’ouvrage actuel est conçu sur <strong>deux niveaux, complétés par une toiture-terrasse</strong>, pour une seule fonction — le stationnement — répartie sur ces trois niveaux.</p><p><strong>Près de 100 m de longueur × 40 m de profondeur</strong>, pour une toiture-terrasse située à <strong>≈ 5,40 m au-dessus du Niveau 0</strong>.</p><p>Côté place du marché, <strong>un appendice regroupe les locaux liés à la gestion du parking et les deux ascenseurs assurant les circulations verticales des usagers</strong>. Principal point de liaison piétonne entre les niveaux de stationnement et le Niveau 0, il apparaît, à ce stade des informations disponibles à l’AMO, <strong>fonctionnellement rattaché au parking maintenu au Niveau 0</strong> ; son statut au regard du périmètre attribué à CQFD reste à confirmer.</p>' },
                    { html: '<span class="comment-kicker">JURIDIQUEMENT</span>Une attribution <strong>doublement limitée</strong> : <strong>dans l’espace, au Niveau 1 et à la toiture-terrasse, tandis que le Niveau 0 reste affecté au stationnement</strong> ; <strong>dans le temps, par une AOT constitutive de droits réels d’une durée de 35 ans</strong>. Cette durée doit être mise en regard <strong>des investissements nécessaires à la transformation de l’ouvrage et de leur amortissement</strong>.' },
                    { html: '<span class="comment-kicker">CADRE D’URBANISME RÉGLEMENTAIRE</span>Le PLU fixe actuellement une hauteur maximale de <strong>6 m</strong>, pour une toiture-terrasse existante située à <strong>≈ 5,40 m au-dessus du Niveau 0</strong>. Les échanges intervenus à ce jour avec la Ville font état d’une <strong>évolution envisagée de la hauteur réglementaire jusqu’à 10 m</strong>, restant à confirmer et à traduire dans le document d’urbanisme. Cette évolution convergerait avec le programme recherché : transformer la toiture-terrasse en <strong>véritable espace de vie et d’activités</strong>, intégrant selon les besoins volumes clos, couverts et espaces protégés.' },
                    { html: '<span class="comment-kicker">OPÉRATIONNELLEMENT</span>Le Niveau 0 reste un parking public, mais devient aussi le socle d’accès aux nouvelles activités. <strong>La capacité de stationnement réellement mobilisable par CQFD constitue une donnée majeure de leur faisabilité et de leur attractivité.</strong>' },
                    { tag: "div", html: '<span class="comment-kicker">INTERFACES TECHNIQUES À TRAITER</span><p>Deux usages vont désormais coexister dans <strong>un même ouvrage conçu à l’origine pour le seul stationnement</strong>, sur deux niveaux et une toiture-terrasse.</p><p><strong>Ces interfaces viennent en complément du renforcement structurel déjà identifié par l’étude du BET structure sur la base du préprogramme.</strong> La transformation impose notamment de :</p><ul><li><strong>neutraliser ou transformer les rampes voitures</strong> reliant le Niveau 0 aux niveaux supérieurs ;</li><li><strong>séparer les environnements</strong> entre le parking maintenu au Niveau 0 et les nouveaux espaces occupés du Niveau 1 et de la toiture-terrasse transformée ;</li><li><strong>rendre autonomes les accès et circulations</strong> des nouvelles activités, tout en assurant leur liaison avec le stationnement du Niveau 0 ;</li><li><strong>organiser l’autonomie des réseaux et de la viabilité</strong> nécessaires aux espaces CQFD ;</li><li><strong>recomposer la gestion des eaux pluviales</strong> en fonction des nouveaux usages.</li></ul>' },
                    { html: '<span class="comment-kicker">ANCRAGE AU SOL ET AUX ABORDS</span>Même si la transformation porte principalement sur le Niveau 1 et la toiture-terrasse, <strong>le projet ne peut être conçu « hors sol »</strong>. Ses abords doivent participer à sa métamorphose et organiser une relation lisible entre <strong>espace public, entrée et activités des niveaux supérieurs</strong>. La bande foncière d’environ <strong>8 m au pied de la façade sur le littoral</strong> doit être intégrée à la réflexion de conception pour <strong>ancrer l’architecture, mettre en scène l’entrée et accompagner la façade par un traitement paysager à l’échelle de l’ouvrage</strong>.' },
                    { html: '<span class="comment-kicker">FINALITÉ ARCHITECTURALE</span>La transformation des usages doit s’accompagner d’une <strong>véritable métamorphose architecturale</strong>, capable de faire évoluer la perception actuelle du parking silo vers celle d’une <strong>destination identifiable, attractive et accueillante</strong>. L’architecture n’est pas une finalité en soi : elle doit <strong>servir l’attractivité, le fonctionnement et la réussite des activités</strong> que CQFD souhaite développer sur le site. L’enjeu est de créer <strong>une adresse, une identité et une expérience</strong>, donnant envie de s’arrêter, d’entrer, de découvrir les lieux et d’y revenir.' },
                    { html: '<span class="comment-kicker force-title">À RETENIR</span><div class="line-force"><span><strong>UN OUVRAGE<br>À TRANSFORMER</strong></span><span><strong>DES CONTRAINTES<br>À MAÎTRISER</strong></span><span><strong>UNE NOUVELLE<br>IDENTITÉ À CRÉER</strong></span><span><strong>UNE DESTINATION<br>À FAIRE VIVRE</strong></span></div>' }

                    "In consectetur nisl ut purus molestie, non gravida justo euismod. Donec erat odio, tempus in ultricies vel, aliquet eget libero. Suspendisse ac arcu nec sem gravida condimentum. Maecenas elementum leo ut nisi accumsan vestibulum. Duis mattis dolor blandit varius dictum. Donec tincidunt nisl id dictum cursus. Suspendisse aliquet ante quis blandit malesuada. Cras ut arcu imperdiet, vulputate justo non, tincidunt leo. Nam eleifend iaculis orci, vitae luctus ex blandit ut. Morbi eget tortor vulputate, efficitur felis a, ornare velit. Nunc lacinia auctor nisi, vitae tristique quam eleifend vel.Fusce eu lacus ut leo dapibus condimentum eu laoreet diam. Pellentesque molestie eleifend mi, nec venenatis elit lobortis vel. Etiam imperdiet mauris sit amet purus rhoncus, non varius mi rutrum. Donec pretium convallis eros, eu ullamcorper urna convallis ut. Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas. Mauris iaculis, orci vel sagittis imperdiet, urna nunc porttitor quam, ut finibus lorem orci vel arcu. Integer accumsan tempor justo, quis dapibus elit pulvinar et. Aliquam erat volutpat. Duis orci dui, placerat eu blandit venenatis, tristique non sem.Phasellus purus ante, consectetur vitae scelerisque sed, faucibus vitae nunc. Morbi semper laoreet sodales. Duis vel dui et eros aliquam rutrum. Aliquam erat volutpat. Aenean non pellentesque ex. Curabitur lacinia, nisl id commodo condimentum, ligula purus facilisis justo, ac tincidunt quam nunc non ligula. Mauris leo ex, ornare nec justo non, egestas faucibus ante. Vestibulum erat dui, pulvinar id urna sit amet, vestibulum viverra felis. Etiam porttitor mi nibh, maximus imperdiet dui eleifend non. Etiam aliquam tempor volutpat. Praesent sed felis non dolor sollicitudin cursus at sed mauris. Phasellus eget libero vel velit mollis fermentum sed sit amet metus. Morbi eu lectus semper, condimentum neque at, pulvinar elit. Donec eget magna mi. Proin sed libero vitae dolor porttitor pretium sollicitudin sed leo."
                ],
                photo: ""

            {
                title:    "Enveloppe",
                subtitle: "architecturale",
                color:    "#1e7fe6",
                model:    "e3b76cc190a648eab7eb2d29ecfd0c0d",
                note:     "Les façades et l'extention forment une enveloppe unique",
                comments: [],
                photo: "plan parking top.jpg"
            },
            {
                title:    "Circulations",
                subtitle: "verticales",
                color:    "#9b4ff0",
                model:    "ID_MODELE_4",
                note:     "",
                comments: [],
                photo: ""
            },
            {
                title:    "Structure",
                subtitle: "Interventions techniques",
                color:    "#e5b112",
                model:    "ID_MODELE_5",
                note:     "",
                comments: [],
                photo: ""
            },
            {
                title:    "Viabilisation",
                subtitle: "Réseaux",
                color:    "#12b5cf",
                model:    "ID_MODELE_6",
                note:     "",
                comments: [],
                photo: ""
            },
            {
                title:    "Foncier périphérique",
                subtitle: "",                      /* vide = pas de 2e ligne */
                color:    "#dd2a7b",
                model:    "ID_MODELE_7",
                note:     "",
                comments: [],
                photo: ""
            },
            {
                title:    "Stationnement",
                subtitle: "Exemple de répartition",
                color:    "#1e74e8",
                model:    "ID_MODELE_8",
                note:     "",
                comments: [],
                photo: ""
            }
            /* Le numéro s'affiche automatiquement (1, 2, 3…).
               Pour le forcer : ajouter  number: "A"  dans une thématique. */
        ]
    };


    /* ══════════════════════════════════════════════════════════════
     *  CODE — normalement, pas besoin d'y toucher
     * ══════════════════════════════════════════════════════════════ */

    const ICONS = {
        eye:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
        puzzle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4H4z"/></svg>',
        target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/></svg>',
        arrow:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11 21 3 13 21 11 13z"/></svg>',
        prev:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
        next:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
        cube:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>'
    };

    function $(selector) { return document.querySelector(selector); }

    function make(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
    }

    function makeIcon(name) {
        const wrap = make("span", "icon");
        wrap.setAttribute("aria-hidden", "true");
        wrap.innerHTML = ICONS[name] || "";
        return wrap;
    }

    function modelUrl(model) {
        if (!model || /^ID_/i.test(model)) return "";
        const base = /^https?:\/\//i.test(model)
            ? model
            : "https://sketchfab.com/models/" + model + "/embed";
        const qs = new URLSearchParams(CONFIG.sketchfabOptions).toString();
        return qs ? base + (base.includes("?") ? "&" : "?") + qs : base;
    }

    function themeNumber(theme, index) {
        return theme.number != null ? theme.number : index + 1;
    }


    /* ── Bandeau ── */
    document.title = CONFIG.pageTitle;
    $("#brandTitle").textContent    = CONFIG.brand.title;
    $("#brandSub").textContent      = CONFIG.brand.subtitle;
    $("#headlineTitle").textContent = CONFIG.headline.title;
    $("#headlineSub").textContent   = CONFIG.headline.subtitle;
    $("#sidebarTitle").textContent  = CONFIG.sidebarTitle;

    CONFIG.actions.forEach(function (a) {
        const node = a.link ? make("a", "action") : make("div", "action");
        if (a.link) node.href = a.link;
        node.append(makeIcon(a.icon), make("span", "action-label", a.label));
        $("#actions").append(node);
    });

    (function buildPartnerLogo() {
        const p = CONFIG.partner;
        if (!p || !p.logoSrc) return;
        const node = p.link ? make("a", "partner") : make("div", "partner");
        if (p.link) node.href = p.link;

        const img = document.createElement("img");
        img.src = p.logoSrc;
        img.alt = p.alt || "";

        node.append(img);
        $("#partnerSlot").append(node);
    })();

    (function buildNavButton() {
        const n = CONFIG.navButton;
        const node = n.link ? make("a", "nav-btn") : make("button", "nav-btn");
        if (n.link) node.href = n.link; else node.type = "button";
        node.setAttribute("aria-label", n.ariaLabel);
        node.append(makeIcon("arrow"));
        $("#navSlot").append(node);
    })();


    /* ── Cartouche : boutons précédent / suivant ── */
    (function buildStepButtons() {
        const prev = $("#prevBtn"), next = $("#nextBtn");
        prev.setAttribute("aria-label", CONFIG.stepButtons.previous);
        next.setAttribute("aria-label", CONFIG.stepButtons.next);
        prev.append(makeIcon("prev"));
        next.append(makeIcon("next"));
        prev.addEventListener("click", function () { step(-1); });
        next.addEventListener("click", function () { step(1); });
    })();

    $("#emptyIcon").innerHTML = ICONS.cube;
    $("#photoEmptyIcon").innerHTML = ICONS.cube;
    $("#photoEmptyMsg").textContent = CONFIG.photoEmptyMessage;
    $("#commentsTitle").textContent = CONFIG.commentsTitle;


    /* ── Menu des thématiques ── */
    const themeButtons = [];
    let currentTheme = -1;

    CONFIG.themes.forEach(function (t, i) {
        const li  = make("li");
        const btn = make("button", "theme");
        btn.type = "button";
        btn.style.setProperty("--c", t.color);

        const text = make("span", "theme-text");
        text.append(make("span", "theme-title", t.title));
        if (t.subtitle) text.append(make("span", "theme-sub", t.subtitle));

        btn.append(make("span", "chip", themeNumber(t, i)), text);
        btn.addEventListener("click", function () { selectTheme(i); });

        li.append(btn);
        $("#themeList").append(li);
        themeButtons.push(btn);
    });

    /* Flèches du clavier dans le menu */
    $("#themeList").addEventListener("keydown", function (e) {
        const dir = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
        if (!dir) return;
        e.preventDefault();
        step(dir);
        themeButtons[currentTheme].focus();
    });


    /* ── Changement de thématique ── */
    const sheet = $("#sheet");
    const frame = $("#viewerFrame");
    const empty = $("#viewerEmpty");

    /* Le viewer apparaît en fondu une fois le modèle chargé */
    frame.addEventListener("load", function () {
        if (frame.getAttribute("src")) frame.classList.add("is-ready");
    });

    function step(delta) {
        const n = CONFIG.themes.length;
        selectTheme((currentTheme + delta + n) % n);
    }

    function selectTheme(index) {
        if (index === currentTheme) return;
        currentTheme = index;

        themeButtons.forEach(function (btn, k) {
            if (k === index) btn.setAttribute("aria-current", "true");
            else btn.removeAttribute("aria-current");
        });
        themeButtons[index].scrollIntoView({ block: "nearest", inline: "nearest" });

        const theme = CONFIG.themes[index];

        /* Cartouche */
        sheet.style.setProperty("--c", theme.color);
        $("#sheetChip").textContent  = themeNumber(theme, index);
        $("#sheetTitle").textContent = theme.title;
        $("#sheetSub").textContent   = theme.subtitle || "";
        $("#sheetSub").hidden        = !theme.subtitle;
        $("#sheetCount").textContent = (index + 1) + " / " + CONFIG.themes.length;
        $("#sheetNote").textContent  = theme.note || "";
        $("#sheetNote").hidden       = !theme.note;

        /* Panneau commentaires */
        const body = $("#commentsBody");
        body.innerHTML = "";
        const paragraphs = (theme.comments && theme.comments.length) ? theme.comments : [CONFIG.commentsPlaceholder];
        paragraphs.forEach(function (item) {
            const p = make((item && item.tag) || "p");
            if (item && typeof item === "object" && item.html) {
                p.innerHTML = item.html;
            } else {
                p.textContent = item;
            }
            if (!theme.comments || !theme.comments.length) p.className = "is-placeholder";
            body.append(p);
        });

        /* Panneau photo */
        const photoImg = $("#photoImg"), photoEmpty = $("#photoEmpty");
        if (theme.photo) {
            photoImg.src = theme.photo;
            photoImg.alt = theme.title;
            photoImg.hidden = false;
            photoEmpty.hidden = true;
        } else {
            photoImg.hidden = true;
            photoImg.removeAttribute("src");
            photoEmpty.hidden = false;
        }

        /* Viewer */
        const url = modelUrl(theme.model);
        frame.classList.remove("is-ready");

        if (url) {
            empty.hidden = true;
            frame.hidden = false;
            frame.title  = CONFIG.viewerTitle + " – " + theme.title;
            frame.src    = url;
        } else {
            frame.hidden = true;
            frame.removeAttribute("src");
            $("#viewerEmptyMsg").textContent = CONFIG.emptyMessage;
            empty.hidden = false;
        }
    }

    selectTheme(CONFIG.defaultTheme);

</script>

</body>
